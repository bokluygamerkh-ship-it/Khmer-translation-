<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>HY-EDITOR Video</title>
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #131A28;
            --bg-surface: #1C2538;
            --accent: #7C3AED;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #2A3B54;
        }

        body {
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .sidebar {
            width: 72px;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo { font-weight: 800; font-size: 20px; color: var(--accent); margin-bottom: 48px; }

        .nav-icon {
            width: 40px; height: 40px; background: var(--bg-surface);
            border-radius: 12px; margin-bottom: 24px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .nav-icon.active { background: var(--accent); }

        main {
            flex: 1; display: grid; grid-template-columns: 1fr 340px;
            grid-template-rows: 1fr 200px; gap: 16px; padding: 16px;
            overflow: hidden; box-sizing: border-box;
        }

        .viewer-container {
            background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }

        #videoElement { max-width: 100%; max-height: 100%; display: none; }

        .upload-zone {
            border: 2px dashed var(--border); padding: 40px; text-align: center;
            border-radius: 16px; cursor: pointer;
        }

        .inspector {
            background: var(--bg-card); border-radius: 16px; border: 1px solid var(--border);
            padding: 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto;
        }

        h3 { margin: 0; font-size: 18px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 14px; color: var(--text-muted); }
        input[type="range"] { width: 100%; accent-color: var(--accent); }
        select { padding: 8px; background: var(--bg-surface); color: white; border: 1px solid var(--border); border-radius: 6px; }

        .btn-action {
            background: var(--accent); color: white; border: none; padding: 12px;
            border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center;
        }

        .timeline-container {
            grid-column: span 2; background: var(--bg-card); border-radius: 16px;
            border: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px; gap: 10px;
        }

        .track-container { flex: 1; background: var(--bg-surface); border-radius: 8px; position: relative; }
        .clip {
            height: 80%; background: var(--accent); border-radius: 6px; position: absolute;
            left: 20px; top: 10%; width: 250px; display: none; align-items: center;
            padding: 0 10px; font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">HY</div>
        <div class="nav-icon active">📺</div>
        <div class="nav-icon">✨</div>
        <div class="nav-icon">⚙️</div>
    </div>
    
    <main>
        <div class="viewer-container">
            <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
                <div>⬆️</div>
                <div style="font-weight: 600; margin-top: 8px;">ជ្រើសរើសវីដេអូ</div>
                <input type="file" id="fileInput" accept="video/*" style="display: none" onchange="handleFileUpload(event)">
            </div>
            <video id="videoElement" controls></video>
        </div>

        <div class="inspector">
            <h3>ឧបករណ៍កែច្នៃ</h3>
            <div class="control-group">
                <label>បែបផែន (Filters)</label>
                <select id="filterSelect" onchange="ApplyEffects()">
                    <option value="none">ធម្មតា</option>
                    <option value="grayscale(100%)">ស‑ខ្មៅ</option>
                    <option value="sepia(100%)">បុរាណ (Sepia)</option>
                    <option value="invert(100%)">បញ្ច្រាស់ពណ៌</option>
                </select>
            </div>
            <div class="control-group">
                <label>កម្រិតពន្លឺ</label>
                <input type="range" id="brightness" min="0" max="200" value="100" oninput="ApplyEffects()">
            </div>
            <div class="control-group">
                <label>កម្រិតព្រិល (Blur)</label>
                <input type="range" id="blur" min="0" max="20" value="0" oninput="ApplyEffects()">
            </div>
            <div class="control-group">
                <label>ការច្រឹប (Zoom/Crop)</label>
                <input type="range" id="zoom" min="1" max="3" step="0.1" value="1" oninput="ApplyEffects()">
            </div>
            <button class="btn-action" onclick="downloadVideo()">ទាញយកវីដេអូ</button>
        </div>

        <div class="timeline-container">
            <div style="font-weight: 600; font-size: 14px;">Timeline</div>
            <div class="track-container">
                <div class="clip" id="videoClip">Video_Track.mp4</div>
            </div>
        </div>
    </main>

    <script>
        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const videoURL = URL.createObjectURL(file);
                const videoElement = document.getElementById('videoElement');
                videoElement.src = videoURL;
                videoElement.style.display = 'block';
                document.querySelector('.upload-zone').style.display = 'none';
                
                const clip = document.getElementById('videoClip');
                clip.style.display = 'flex';
                clip.textContent = file.name;
            }
        }

        function ApplyEffects() {
            const video = document.getElementById('videoElement');
            const filter = document.getElementById('filterSelect').value;
            const brightness = document.getElementById('brightness').value;
            const blur = document.getElementById('blur').value;
            const zoom = document.getElementById('zoom').value;

            video.style.filter = `${filter} brightness(${brightness}%) blur(${blur}px)`;
            video.style.transform = `scale(${zoom})`;
        }

        function downloadVideo() {
            const video = document.getElementById('videoElement');
            if (!video.src) {
                alert('សូមមេត្តាបញ្ចូលវីដេអូសិន!');
                return;
            }
            const a = document.createElement('a');
            a.href = video.src;
            a.download = 'Edited_Hi-C_Video.mp4';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
