
<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>HYZzy Editor Video</title>
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #131A28;
            --bg-surface: #1C2538;
            --accent: #7C3AED;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #2A3B54;
        }

        body {
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .sidebar {
            width: 72px;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo {
            font-weight: 800;
            font-size: 20px;
            color: var(--accent);
            margin-bottom: 48px;
        }

        .nav-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-surface);
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .nav-icon.active { background: var(--accent); }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 340px;
            grid-template-rows: 1fr 200px;
            gap: 16px;
            padding: 16px;
            overflow: hidden;
            box-sizing: border-box;
        }

        .viewer-container {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .upload-zone {
            border: 2px dashed var(--border);
            padding: 40px;
            text-align: center;
            border-radius: 16px;
        }

        .inspector {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
        }

        h3 { margin: 0; font-size: 18px; }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 14px; color: var(--text-muted); }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .timeline-container {
            grid-column: span 2;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 10px;
        }

        .track-container {
            flex: 1;
            background: var(--bg-surface);
            border-radius: 8px;
            position: relative;
        }

        .clip {
            height: 80%;
            background: var(--accent);
            border-radius: 6px;
            position: absolute;
            left: 20px;
            top: 10%;
            width: 250px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Hi-C</div>
        <div class="nav-icon active">📺</div>
        <div class="nav-icon">✨</div>
        <div class="nav-icon">⚙️</div>
    </div>
    
    <main>
        <div class="viewer-container">
            <div class="upload-zone">
                <div>⬆️</div>
                <div style="font-weight: 600; margin-top: 8px;">ទាញ និងទម្លាក់វីដេអូនៅទីនេះ</div>
            </div>
        </div>

        <div class="inspector">
            <h3>ការកំណត់</h3>
            <div class="control-group">
                <label>កម្រិតពន្លឺ</label>
                <input type="range" min="0" max="200" value="100">
            </div>
            <div class="control-group">
                <label>កម្រិតព្រិល (Blur)</label>
                <input type="range" min="0" max="100" value="0">
            </div>
        </div>

        <div class="timeline-container">
            <div style="font-weight: 600; font-size: 14px;">Timeline</div>
            <div class="track-container">
                <div class="clip">Video_Track_01.mp4</div>
            </div>
        </div>
    </main>
</body>
</html>
