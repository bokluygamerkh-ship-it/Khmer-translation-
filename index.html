<!DOCTYPE html>
<html>
<head>
<title>ទាញយកវីដេអូ</title>
</head>
<body>
<h2>ទាញយកវីដេអូ</h2>
<input type="text" id="videoUrl" placeholder="បិទភ្ជាប់ Link នៅទីនេះ">
<button onclick="downloadVideo()">ទាញយក</button>
<script>
function downloadVideo() {
  const url = document.getElementById('videoUrl').value;
  alert('កំពុងដំណើរការ Link: ' + url);
}
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>Hi-C Editor Video</title>
    <style>
        body { margin: 0; background-color: #121218; color: #fff; font-family: sans-serif; display: flex; height: 100vh; }
        .sidebar { width: 60px; background: #1a1a24; display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px solid #2a2a36; }
        .logo { font-weight: bold; color: #a855f7; margin-bottom: 40px; }
        .nav-icon { width: 30px; height: 30px; background: #2a2a36; border-radius: 8px; margin-bottom: 20px; }
        main { flex: 1; display: grid; grid-template-rows: 2fr 1fr; grid-template-columns: 3fr 1fr; gap: 15px; padding: 20px; }
        .viewer { background: #1a1a24; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .upload-card { border: 2px dashed #4a4a6a; padding: 40px; text-align: center; border-radius: 12px; }
        .timeline { background: #1a1a24; border-radius: 12px; grid-column: span 2; display: flex; align-items: center; padding: 20px; gap: 20px; }
        .track { flex: 1; height: 60px; background: #232331; border-radius: 8px; position: relative; }
        .clip { width: 150px; height: 100%; background: #6366f1; border-radius: 6px; position: absolute; }
        .inspector { background: #1a1a24; border-radius: 12px; padding: 20px; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; margin-bottom: 8px; color: #a1a1aa; }
        .slider { width: 100%; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Hi-C</div>
        <div class="nav-icon"></div>
        <div class="nav-icon"></div>
        <div class="nav-icon"></div>
    </div>
    <main>
        <div class="viewer">
            <div class="upload-card">
                <p>ទាញ និងទម្លាក់វីដេអូនៅទីនេះ</p>
            </div>
        </div>
        <div class="inspector">
            <h3>ការកំណត់</h3>
            <div class="control-group">
                <label>កម្រិតពន្លឺ</label>
                <input type="range" class="slider">
            </div>
            <div class="control-group">
                <label>ទំហំអក្សរ</label>
                <input type="range" class="slider">
            </div>
        </div>
        <div class="timeline">
            <div>Timeline</div>
            <div class="track">
                <div class="clip"></div>
            </div>
        </div>
    </main>
</body>
</html>
