<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>HY-EDITOR Pro</title>
    <style>
        :root {
            --bg-main: #0B0F19;
            --bg-card: #131A28;
            --bg-surface: #1C2538;
            --accent: #7C3AED;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border: #2A3B54;
        }
        margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 90px;
            background: var(--bg-card);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            border-right: 1px solid var(--border);
            z-index: 10;
        }
        .logo { font-weight: 800; font-size: 24px; color: var(--accent); margin-bottom: 36px; }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-bottom: 24px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-muted);
            transition: all 0.3s;
        }
        .nav-icon {
            width: 48px; height: 48px; background: var(--bg-surface);
            border-radius: 16px; display: flex;
            align-items: center; justify-content: center; font-size: 24px;
        }
        .nav-item.active { color: var(--accent); }
        .nav-item.active .nav-icon { background: var(--accent); color: white; transform: scale(1.05); }
        .nav-label { font-size: 11px; font-weight: 600; }
        
        main { flex: 1; position: relative; overflow: hidden; }
        .app-view {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            padding: 24px; display: none; grid-template-columns: 1fr 340px; gap: 20px;
        }
        .app-view.active { display: grid; }
        .viewer-container {
            background: var(--bg-card); border-radius: 20px; border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; position: relative;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">HY</div>
        <a class="nav-item active" onclick="switchTab('editor', this)">
            <div class="nav-icon">📺</div>
            <div class="nav-label">Edit Video</div>
        </a>
        <a class="nav-item" onclick="switchTab('ai', this)">
            <div class="nav-icon">✨</div>
            <div class="nav-label">AI Generate</div>
        </a>
        <a class="nav-item" onclick="switchTab('download', this)">
            <div class="nav-icon">⬇️</div>
            <div class="nav-label">Download</div>
        </a>
        <a class="nav-item" onclick="switchTab('settings', this)">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label">Setting</div>
        </a>
    </div>

    <main>
        <div id="editor" class="app-view active">
            <div class="viewer-container">អត្ថបទកែសម្រួលវីដេអូ</div>
        </div>
        <div id="ai" class="app-view">
            <div class="viewer-container">ផ្ទាំងបង្កើត AI</div>
        </div>
        <div id="download" class="app-view">
            <div class="viewer-container">ផ្ទាំងទាញយក</div>
        </div>
        <div id="settings" class="app-view">
            <div class="viewer-container">ផ្ទាំងកំណត់ការ</div>
        </div>
    </main>

    <script>
        function switchTab(tabId, element) {
            document.querySelectorAll('.app-view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            const targetView = document.getElementById(tabId);
            if (targetView) {
                targetView.classList.add('active');
            }
            if (element) {
                element.classList.add('active');
            }
        }
    </script>
</body>
</html>
